[project]
name = "brainscan-ai"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "python-multipart",
    "pydantic",
    "onnxruntime",
    "numpy",
    "pandas",
    "matplotlib",
    "pillow",
    "fpdf2",
    "google-generativeai",
    "huggingface_hub",
    "libsql-client",
]

[tool.fastapi]
entrypoint = "src.app:app"
